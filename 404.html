<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="noindex" />
    <title>ARtifiact — Get the app to view this scene</title>

    <!--
      TODO (deferred): replace this catch-all 404 with a real /scene/<id> page
      once ARtifiact is live on the App Store.

      That page should:
        • Add <meta name="apple-itunes-app" content="app-id=YOUR_APP_STORE_ID">
          so iOS shows the native Smart App Banner at the top of Safari.
        • Optionally fetch a scene snapshot/title from a public endpoint and
          render an Open Graph preview so the link unfurls nicely in Messages,
          iMessage previews, Slack, etc.
        • Keep the "Get ARtifiact" CTA pointing to the real App Store URL.

      For now, the static fallback below is good enough to (a) not look broken
      when a non-installer taps a shared link, and (b) point them at the home
      page where they can learn what ARtifiact is.

      Universal links bypass this page entirely when the recipient already has
      the app installed — iOS intercepts the URL before Safari resolves it.
      So everyone who sees this page is by definition a candidate to install.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0a0a0a;
        --surface-color: #141414;
        --primary-color: #8a2be2;
        --secondary-color: #00d4ff;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --glass-border: rgba(255, 255, 255, 0.1);
        --font-heading: 'Outfit', sans-serif;
        --font-body: 'Inter', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-body);
        line-height: 1.6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background-image:
          radial-gradient(
            circle at 20% 30%,
            rgba(138, 43, 226, 0.18),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(0, 212, 255, 0.12),
            transparent 50%
          );
      }

      .wrap {
        max-width: 520px;
        text-align: center;
      }

      .logo {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 3rem;
      }

      .logo span {
        color: var(--primary-color);
      }

      .badge {
        display: inline-block;
        font-family: var(--font-heading);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--secondary-color);
        background: rgba(0, 212, 255, 0.1);
        border: 1px solid rgba(0, 212, 255, 0.3);
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
        margin-bottom: 1.25rem;
      }

      .gradient-text {
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      p {
        color: var(--text-secondary);
        font-size: 1.05rem;
        margin-bottom: 2rem;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .cta {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 1rem;
        padding: 0.85rem 1.8rem;
        border-radius: 30px;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        display: inline-block;
      }

      .cta-primary {
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        color: var(--text-primary);
        box-shadow: 0 8px 24px rgba(138, 43, 226, 0.35);
      }

      .cta-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(138, 43, 226, 0.45);
      }

      .cta-secondary {
        color: var(--text-primary);
        background: transparent;
        border: 1px solid var(--glass-border);
      }

      .cta-secondary:hover {
        border-color: rgba(255, 255, 255, 0.3);
      }

      .scene-id {
        margin-top: 2.5rem;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.35);
        word-break: break-all;
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <div class="logo">Invisible<span>Reality</span></div>

      <div id="content">
        <!-- Default state — generic 404. The script below swaps this for the
             AR-scene-specific copy when the path looks like /scene/<id>. -->
        <div class="badge">Page not found</div>
        <h1>This page doesn't <span class="gradient-text">exist</span>.</h1>
        <p>
          The link you followed might be broken, or the page may have moved.
        </p>
        <div class="actions">
          <a class="cta cta-primary" href="/">Go to homepage</a>
        </div>
      </div>

      <div class="scene-id" id="scene-id" hidden></div>
    </main>

    <script>
      // Tailor the message when the missing path looks like a shared AR scene.
      // `/scene/<id>` paths are universal-link targets — they're only ever served
      // by this 404 page when the visitor doesn't have the ARtifiact app installed.
      (function () {
        var path = window.location.pathname || '';
        var match = path.match(/^\/scene\/([^\/]+)\/?$/);
        if (!match) return;

        var sceneId = match[1];
        var content = document.getElementById('content');
        if (!content) return;

        content.innerHTML = [
          '<div class="badge">Shared AR scene</div>',
          '<h1>This is an <span class="gradient-text">AR scene</span> shared with you.</h1>',
          '<p>You need the ARtifiact app to view it. Once you install ARtifiact, tap the link again and the scene will open right up.</p>',
          '<div class="actions">',
          // TODO: replace href="/" with the real App Store URL once on the store.
          '  <a class="cta cta-primary" href="/">Get ARtifiact</a>',
          '  <a class="cta cta-secondary" href="/">Learn more</a>',
          '</div>'
        ].join('');

        var idEl = document.getElementById('scene-id');
        if (idEl) {
          idEl.hidden = false;
          idEl.textContent = 'Scene ID: ' + sceneId;
        }
      })();
    </script>
  </body>
</html>
